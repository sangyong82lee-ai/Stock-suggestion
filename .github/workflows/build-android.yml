name: Build Android APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Install Android project dependencies
        working-directory: android
        run: |
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-stock-screener-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Get APK info
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: $(basename $APK_PATH)" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Download from the **Artifacts** section above" >> $GITHUB_STEP_SUMMARY
